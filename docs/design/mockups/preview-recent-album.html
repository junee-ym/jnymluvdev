<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>최근 앨범 미리보기</title>
<link rel="stylesheet" href="../../../src/app/globals.css">
<style>body{ padding:40px; } .preview-wrap{ max-width:520px; }</style>
</head>
<body>
  <div class="bento preview-wrap">
    <div class="card w-album">
      <div class="card-head">
        <div class="card-title">최근 앨범</div>
        <a class="card-link">전체 보기 →</a>
      </div>
      <div class="album-carousel">
        <div class="album-track">
          <div class="ph"><img src="https://picsum.photos/id/1015/800/600" style="width:100%;height:100%;object-fit:contain"></div>
          <div class="ph"><img src="https://picsum.photos/id/1016/600/900" style="width:100%;height:100%;object-fit:contain"></div>
          <div class="ph"><img src="https://picsum.photos/id/1018/800/600" style="width:100%;height:100%;object-fit:contain"></div>
          <div class="ph"><img src="https://picsum.photos/id/1019/700/700" style="width:100%;height:100%;object-fit:contain"></div>
          <div class="ph"><img src="https://picsum.photos/id/1022/600/900" style="width:100%;height:100%;object-fit:contain"></div>
        </div>
        <button type="button" class="album-nav prev">‹</button>
        <button type="button" class="album-nav next">›</button>
      </div>
    </div>
  </div>
</body>
</html>
